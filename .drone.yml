# 项目的.drone.yml 文件
kind: pipeline
type: docker
name: erp-web

steps:
  # 构建缓存
  - name: loading cache # 加载缓存
    pull: if-not-exists # 如果镜像不存在则拉取,免去每次都要重新下载
    image: drillster/drone-volume-cache
    volumes:
    - name: cache
      path: /cache
    settings:
      restore: true
      mount:
      - ./node_modules

  # npm 构建
  - name: npm-build
    pull: if-not-exists
    image: 192.168.6.12:3002/library/node:20.15.1
    commands:
      - pwd
      - ls -alt
      - npm config set registry https://registry.npmmirror.com
      - npm i -g pnpm
      - pnpm store prune
      - pnpm install --verbose
      - npm run build:fast

  # 构建镜像并推送到镜像仓库
  - name: build-docker-image
    pull: if-not-exists
    image: plugins/docker
    settings:
      username: admin
      password:
        from_secret: harbor_admin_password
      registry: 192.168.6.12:3002
      repo: 192.168.6.12:3002/erp-web/web
      debug: true
      insecure: true
      tags:
        - v1.0

  # 远程到主机并运行docker compose
  - name: deploy-run
    pull: if-not-exists
    image: appleboy/drone-ssh
    pull: true
    settings:
      host: 192.168.6.12
      port: 22
      username: attom-12
      password:
        from_secret: ssh_password
      # 使用docker compose拉去对应的镜像，并运行
      script:
        - cd ~/app/erp/web && docker compose pull && docker compose up -d

  # 构建缓存
  - name: rebuild-cache
    pull: if-not-exists
    image: drillster/drone-volume-cache
    volumes:
      - name: cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - ./node_modules

# 挂载卷
volumes:
  - name: cache
    host:
      path: /tmp/drone-cache


# matster分支触发构建
trigger:
  branch:
    - local-dev
