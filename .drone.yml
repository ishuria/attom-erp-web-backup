# 项目的.drone.yml 文件
kind: pipeline
type: docker
name: web

# 声明宿主机 映射到 drone执行器的数据卷
volumes:
  - name: node_modules # 数据卷名称
    host:
      # 宿主机的绝对路径
      path: /home/attom-12/app/erp/web/node_modules

steps:
  # npm 构建
  - name: npm-build
    image: node:20.15.1
    volumes: #
      - name: node_modules # 数据卷名称
        path: /drone/src/node_modules # 容器内的绝对路径
    commands:
      - pwd
      - ls -alt
      - npm config set registry https://registry.npm.taobao.org
      - npm install
      - npm run build

  # 打包构建镜像
  - name: build-docker-image
    image: plugins/docker
    settings:
      username: xiangkai.luo
      password: Lxk11824.
      repo: attom-erp-web
      registry: 192.168.6.12:3002
      tags:
        - v1.0
      context: .
      dockerfile: DockerFile

  # 拉取harbor镜像并运行
  - name: pull-image-and-run
    image: 192.168.6.12:3002/attom-erp-web/web:v1.0
    commands:
      - echo "Starting container from Harbor image..."
      - docker run -d -p 80:80 192.168.6.12:3002/attom-erp-web/web:v1.0

# matster分支触发构建
trigger:
  branch:
    - master
