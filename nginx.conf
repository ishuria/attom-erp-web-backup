# Nginx 缓存配置
# 此配置确保 HTML 文件不缓存，解决 chunk 加载失败问题

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML 文件不缓存，确保用户总是获取最新版本
    # 这是解决 chunk 加载失败的关键配置
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的 JS/CSS 文件长缓存（1年）
    # 因为 hash 变化会自动更新文件名，所以可以安全地长缓存
    location ~* \.(js|css)$ {
        if ($request_uri ~* \.[0-9a-f]{8,}\.(js|css)$) {
            # 带 hash 的文件（如 index-BEzTZLKr.js）可以长缓存
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        try_files $uri =404;
    }

    # 其他静态资源（图片、字体等）中等缓存（1个月）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # 其他文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

