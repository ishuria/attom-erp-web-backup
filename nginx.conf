# Nginx 缓存配置 - 优化版本
# 解决页面长时间不操作后新标签页无法正常加载的问题

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 根路径和HTML文件 - 严格不缓存，确保SPA路由正常工作
    location / {
        # 防止浏览器和服务端缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # 防止中间代理缓存
        add_header Surrogate-Control "no-store" always;
        # 确保每次请求都检查最新版本
        add_header Last-Modified "" always;
        try_files $uri $uri/ /index.html;
    }

    # HTML文件单独处理（备用）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Surrogate-Control "no-store" always;
        add_header Last-Modified "" always;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的 JS/CSS 文件长缓存（1年）
    # 因为 hash 变化会自动更新文件名，所以可以安全地长缓存
    location ~* \.(js|css)$ {
        if ($request_uri ~* \.[0-9a-f]{8,}\.(js|css)$) {
            # 带 hash 的文件（如 index-BEzTZLKr.js）可以长缓存
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
        }
        try_files $uri =404;
    }

    # 其他静态资源（图片、字体等）中等缓存（1个月）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Expires "Thu, 31 Dec 2024 23:55:55 GMT" always;
        try_files $uri =404;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

